name: Upload Post
on:
  workflow_dispatch:
    inputs:
      file:
        description: 'File name'
        required: true
      base64_content:
        description: 'Base64 content'
        required: true
      delete:
        description: 'Delete mode'
        required: false
        default: 'false'

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete file
        if: ${{ inputs.delete == 'true' }}
        run: |
          rm -f uploads/${{ inputs.file }}
          python3 << EOF
import json, ospath = 'data/posts.json'import os.path.exipathpath):


    wopenopen(path) as f:
        data = json.load(f)
    data = [p for p in data if p['image'] != 'uploads/${{ inputs.file }}']with open(path, 'w') as f:
with
        json.dump(data, f, indent=2, ensure_ascii=False)
EOF

      - naUploadload file
        if: ${{ inputs.delete != 'true' }}
        run: |
          mkdir -p uploads data
          echo "${{ inputs.base64_content }}" | base64 -d > uploads/${{ inputs.file }}
          python3 << EOF
import json, os, time
os.makedirs('data', exist_ok=True)
path = 'data/posts.json'
data = []
if os.path.exists(path):
    with open(path) as f:
        data = json.load(f)
data = [p for p in data if p['image'] != 'uploads/${{ inputs.file }}']
post = {
    'image': 'uploads/${{ inputs.file }}',
    'time': int(time.time()),
    'likes': 0,
    'comments': []
}
data.insert(0, post)
with open(path, 'w') as f:
    json.dump(data, f, indent=2, ensure_ascii=False)
EOF

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Update posts" || exit 0
          git push
