<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صفحة المستر</title>
<style>
  :root{--neon:#b026ff;--neon-glow:0 0 8px #b026ff,0 0 20px #b026ff,0 0 40px #b026ff;--bg:#0a0a0f;}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif;}
  body{background:var(--bg);color:#fff;min-height:100vh;padding:20px;}
 .container{max-width:800px;margin:0 auto;}
  h1{text-align:center;color:var(--neon);text-shadow:var(--neon-glow);margin-bottom:30px;}
 .login-box,.upload-box{border:2px dashed var(--neon);border-radius:15px;padding:20px;text-align:center;box-shadow:var(--neon-glow);margin-bottom:30px;}
 .upload-box{display:none;}
  input,button{background:#222;color:#fff;border:1px solid var(--neon);padding:10px;border-radius:10px;font-size:1rem;}
  button{background:var(--neon);cursor:pointer;box-shadow:var(--neon-glow);}
  button:hover{transform:scale(1.05);}
 .post{background:#15151f;border:1px solid #2a2a3a;border-radius:15px;padding:15px;margin-bottom:25px;position:relative;}
 .post img,.post video,.post iframe{width:100%;border-radius:10px;margin-bottom:12px;}
 .actions{display:flex;gap:10px;}
 .action-btn{flex:1;background:transparent;border:1px solid var(--neon);color:var(--neon);padding:10px;border-radius:10px;cursor:pointer;}
 .action-btn:hover{background:var(--neon);color:#fff;box-shadow:var(--neon-glow);}
 .delete-btn{border-color:#ff3366;color:#ff3366;}
 .delete-btn:hover{background:#ff3366;box-shadow:0 0 8px #ff3366,0 0 20px #ff3366;}
</style>
</head>
<body>
<div class="container">
  <h1>⚡ صفحة المستر ⚡</h1>

  <div class="login-box" id="loginBox">
    <input type="password" id="passInput" placeholder="باسورد المدرس">
    <button onclick="login()">دخول</button>
  </div>

  <div class="upload-box" id="uploadBox">
    <input type="file" id="fileInput" accept="image/*,video/*,.pdf">
    <button onclick="logout()" style="margin-top:10px;background:#444;">خروج</button>
  </div>

  <div id="posts">جاري التحميل...</div>
</div>

<script>
const GITHUB_USERNAME = "anwrwjyh759-del";
const GITHUB_REPO = "teacher-page";
const TEACHER_PASS = "250746";

const loginBox = document.getElementById('loginBox');
const uploadBox = document.getElementById('uploadBox');
const isTeacher = localStorage.getItem('isTeacher')==='true';

if(isTeacher){
  showTeacherPanel();
}

function login(){
  if(document.getElementById('passInput').value===TEACHER_PASS){
    localStorage.setItem('isTeacher','true');
    showTeacherPanel();
  }else{
    alert('باسورد غلط');
  }
}

function logout(){
  localStorage.removeItem('isTeacher');
  location.reload();
}

function showTeacherPanel(){
  loginBox.style.display='none';
  uploadBox.style.display='block';
  document.getElementById('fileInput').addEventListener('change',uploadFile);
}

async function uploadFile(e){
  const file = e.target.files[0];
  if(!file) return;

  alert('جاري الرفع... استنى 15 ثانية');
  const base64 = await toBase64(file);
  const content = base64.split(',')[1];
  const filename = Date.now() + '-' + file.name.replace(/\s/g,'_');

  const res = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/actions/workflows/upload.yml/dispatches`,{
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      ref: 'main',
      inputs: {file_name: filename, base64_content: content, delete: 'false'}
    })
  });

  if(res.ok){
    alert('تم الرفع! هتظهر بعد شوية');
    setTimeout(loadPosts, 15000);
  }else{
    alert('فشل الرفع');
  }
}

async function loadPosts(){
  try{
    const res = await fetch(`https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/main/data/posts.json?t=${Date.now()}`);
    const posts = await res.json();
    document.getElementById('posts').innerHTML = '';
    if(posts.length===0){
      document.getElementById('posts').innerHTML = '<p style="text-align:center;color:#888;">مفيش بوستات لسه</p>';
      return;
    }
    posts.forEach(post => renderPost(post));
  }catch(e){
    document.getElementById('posts').innerHTML = '<p style="text-align:center;color:#888;">مفيش بوستات لسه</p>';
  }
}

function renderPost(post){
  const url = post.image;
  const isVideo = url.match(/\.(mp4|webm|mov)$/i);
  const isPDF = url.match(/\.pdf$/i);
  let mediaHTML = '';
  if(isVideo) mediaHTML = `<video src="${url}" controls></video>`;
  else if(isPDF) mediaHTML = `<iframe src="${url}" height="400"></iframe>`;
  else mediaHTML = `<img src="${url}">`;

  const div = document.createElement('div');
  div.className = 'post';
  div.innerHTML = `
    ${mediaHTML}
    <div class="actions">
      <button class="action-btn">❤️ لايك <span>${post.likes || 0}</span></button>
      <button class="action-btn">💬 تعليقات</button>
      ${isTeacher? `<button class="action-btn delete-btn" onclick="deletePost('${post.image}')">🗑️ مسح</button>` : ''}
    </div>
  `;
  document.getElementById('posts').appendChild(div);
}

async function deletePost(imagePath){
  if(!confirm('متأكد عايز تمسح البوست ده؟')) return;

  const filename = imagePath.split('/').pop();

  alert('جاري المسح...');

  const res = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/actions/workflows/upload-file.yml/dispatches`,{
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      ref: 'main',
      inputs: {file_name: filename, base64_content: '', delete: 'true'}
    })
  });

  if(res.ok){
    alert('تم المسح! هتختفي بعد 15 ثانية');
    setTimeout(loadPosts, 15000);
  }else{
    alert('فشل المسح');
  }
}

function toBase64(file){
  return new Promise(r=>{const fr=new FileReader();fr.readAsDataURL(file);fr.onload=()=>r(fr.result);});
}

loadPosts();
</script>
</body>
</html>
